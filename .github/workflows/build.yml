name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Config do Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ -f capacitor_config.json ]; then cp capacitor_config.json capacitor.config.json; fi
      - run: mkdir -p www && cp index.html www/
      - run: npx cap add android
      - name: Permissões de arquivos
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application android:requestLegacyExternalStorage="true"|' $M
      - name: Plugin de permissao (acesso a todos os arquivos)
        run: |
          D=android/app/src/main/java/com/treino/app
          mkdir -p $D
          cat > $D/StoragePermPlugin.java <<'EOF'
          package com.treino.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StoragePerm")
          public class StoragePermPlugin extends Plugin {

              private boolean isGranted() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      return Environment.isExternalStorageManager();
                  }
                  return true;
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("granted", isGranted());
                  call.resolve(ret);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  JSObject ret = new JSObject();
                  if (isGranted()) {
                      ret.put("granted", true);
                      call.resolve(ret);
                      return;
                  }
                  try {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                      intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                  } catch (Exception e) {
                      Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                  }
                  ret.put("granted", false);
                  call.resolve(ret);
              }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.treino.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StoragePermPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: treino-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
